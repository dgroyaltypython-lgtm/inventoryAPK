workflows:
  coastal-pearl-android:
    name: Coastal Pearl Inventory - Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Configure Android and Flutter SDK paths
        script: |
          FLUTTER_PATH="${FLUTTER_ROOT:-$(dirname "$(dirname "$(command -v flutter)")")}"
          SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$FLUTTER_PATH" ] || [ -z "$SDK_PATH" ]; then
            echo "Flutter or Android SDK path was not provided by the build environment."
            exit 1
          fi
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_PATH" "$SDK_PATH" > android/local.properties
      - name: Resolve Flutter packages
        script: flutter pub get
      - name: Analyze source
        script: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run smoke tests
        script: flutter test
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
