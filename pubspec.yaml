name: coastal_pearl_inventory
description: Local-first kitchen and restaurant inventory app for Coastal Pearl.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  sqflite: ^2.4.6
  pdf: ^3.13.1
  share_plus: ^13.3.1
  cross_file: ^0.3.4+2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/inventory_seed.json
